apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "liveboard.fullname" . }}-client-nginx
  labels:
    app.kubernetes.io/component: {{ .Values.client.name }}
    {{- include "liveboard.labels" . | nindent 4 }}
data:
  default.conf: |
    server {
        listen 80;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        gzip on;
        gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;

        location /assets/ {
            expires 1y;
            add_header Cache-Control "public, no-transform";
        }

        location /api/ {
            proxy_pass http://{{ include "liveboard.fullname" . }}-{{ .Values.api.name }}:{{ .Values.api.port }}/api/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /ws {
            proxy_pass http://{{ include "liveboard.fullname" . }}-{{ .Values.api.name }}:{{ .Values.api.port }}/ws;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }

        location /healthz {
            proxy_pass http://{{ include "liveboard.fullname" . }}-{{ .Values.api.name }}:{{ .Values.api.port }}/healthz;
        }

        location /readyz {
            proxy_pass http://{{ include "liveboard.fullname" . }}-{{ .Values.api.name }}:{{ .Values.api.port }}/readyz;
        }

        location /metrics {
            proxy_pass http://{{ include "liveboard.fullname" . }}-{{ .Values.api.name }}:{{ .Values.api.port }}/metrics;
        }

        location / {
            try_files $uri $uri/ /index.html;
        }
    }
