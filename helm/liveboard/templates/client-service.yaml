apiVersion: v1
kind: Service
metadata:
  name: {{ include "liveboard.fullname" . }}-{{ .Values.client.name }}
  labels:
    app.kubernetes.io/component: {{ .Values.client.name }}
    {{- include "liveboard.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.client.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/component: {{ .Values.client.name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
