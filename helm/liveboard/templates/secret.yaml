apiVersion: v1
kind: Secret
metadata:
  name: {{ include "liveboard.fullname" . }}-secret
  labels:
    {{- include "liveboard.labels" . | nindent 4 }}
type: Opaque
stringData:
  POSTGRES_PASSWORD: {{ .Values.postgres.password | quote }}
  DATABASE_URL: "postgresql://{{ .Values.postgres.user }}:{{ .Values.postgres.password }}@{{ include "liveboard.fullname" . }}-{{ .Values.postgres.name }}:{{ .Values.postgres.port }}/{{ .Values.postgres.database }}"
  REDIS_URL: "redis://{{ include "liveboard.fullname" . }}-{{ .Values.redis.name }}:{{ .Values.redis.port }}"
