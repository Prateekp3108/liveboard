apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: liveboard
  namespace: argocd
  labels:
    app.kubernetes.io/name: liveboard
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/Prateekp3108/liveboard.git
    targetRevision: HEAD
    path: helm/liveboard
    helm:
      valueFiles:
        - values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: liveboard
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
  ignoreDifferences:
    - group: apps
      kind: StatefulSet
      jsonPointers:
        - /spec/volumeClaimTemplates
