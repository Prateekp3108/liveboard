services:
  postgres:
    image: postgres:17.2-alpine
    container_name: liveboard-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: liveboard
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d liveboard"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
      - liveboard-net

  redis:
    image: redis:7.4.2-alpine
    container_name: liveboard-redis
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 3s
    networks:
      - liveboard-net

  api:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: liveboard-api
    restart: unless-stopped
    environment:
      PORT: 5000
      NODE_ENV: production
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/liveboard
      REDIS_URL: redis://redis:6379
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:5000/healthz || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
      - liveboard-net

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: liveboard-client
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:80/ || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 3s
    networks:
      - liveboard-net

volumes:
  pgdata:
    driver: local

networks:
  liveboard-net:
    driver: bridge
